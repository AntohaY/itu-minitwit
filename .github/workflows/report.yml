name: Report

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

env:
  REPORT_SOURCE: report/report.md
  REPORT_TARGET_BRANCH: development
  SOURCE_DATE_EPOCH: "0"

permissions:
  contents: write

jobs:
  build-report:
    name: Build Report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare report build directory
        run: |
          mkdir -p report/build
          find report/build -type f -name '*.pdf' -delete
          rm -f report/report.pdf

      - name: Check report word count
        run: |
          words=$(python3 - <<'PY'
          import re
          from pathlib import Path

          import os

          text = Path(os.environ["REPORT_SOURCE"]).read_text(encoding="utf-8")
          text = re.sub(r"---\n.*?\n---\n", "", text, flags=re.S)
          text = re.sub(r"```.*?```", "", text, flags=re.S)
          text = re.sub(r"\[[^\]]+\]\([^)]+\)", "", text)
          print(len(re.findall(r"\b[\w'-]+\b", text)))
          PY
          )
          echo "Report word count: ${words}"
          if [ "${words}" -gt 2500 ]; then
            echo "::warning title=Report word count::Report has ${words} words, which is above the 2500 word limit."
          fi

      - name: Build PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: report
          output_dir: report/build
          images_dir: report/images
          image_import: ./images
          build_html: false

      - name: Locate generated PDF
        id: report_pdf
        run: |
          generated_pdf="$(find report -type f -name 'report.pdf' -print -quit)"
          if [ -z "${generated_pdf}" ]; then
            generated_pdf="$(find report -type f -name '*.pdf' -print -quit)"
          fi
          if [ -z "${generated_pdf}" ]; then
            echo "::error title=Report PDF missing::No PDF was generated by markdown-to-pdf."
            find report -maxdepth 4 -type f -print
            exit 1
          fi
          echo "path=${generated_pdf}" >> "${GITHUB_OUTPUT}"
          ls -lh "${generated_pdf}"

      - name: Upload report PDF
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: ${{ steps.report_pdf.outputs.path }}

      - name: Commit generated PDF
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == env.REPORT_TARGET_BRANCH
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short "${{ steps.report_pdf.outputs.path }}"
          git add "${{ steps.report_pdf.outputs.path }}"
          if git diff --cached --quiet; then
            echo "No report PDF changes to commit."
          else
            git commit -m "Update generated report PDF [skip ci]"
            git push origin "HEAD:${REPORT_TARGET_BRANCH}"
          fi
          

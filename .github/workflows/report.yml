name: Report

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  workflow_dispatch:

env:
  REPORT_SOURCE: report/report.md
  REPORT_OUTPUT: report/build/MSc_group_p.pdf
  REPORT_TARGET_BRANCH: development
  SOURCE_DATE_EPOCH: "0"

permissions:
  contents: write

jobs:
  build-report:
    name: Build Report PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare report build directory
        run: mkdir -p report/build

      - name: Check report word count
        run: |
          words=$(python3 - <<'PY'
          import re
          from pathlib import Path

          import os

          text = Path(os.environ["REPORT_SOURCE"]).read_text(encoding="utf-8")
          text = re.sub(r"---\n.*?\n---\n", "", text, flags=re.S)
          text = re.sub(r"```.*?```", "", text, flags=re.S)
          text = re.sub(r"\[[^\]]+\]\([^)]+\)", "", text)
          print(len(re.findall(r"\b[\w'-]+\b", text)))
          PY
          )
          echo "Report word count: ${words}"
          if [ "${words}" -gt 2500 ]; then
            echo "::warning title=Report word count::Report has ${words} words, which is above the 2500 word limit."
          fi

      - name: Build PDF with Pandoc
        uses: docker://pandoc/latex:3.6
        with:
          args: >-
            ${{ env.REPORT_SOURCE }}
            --from=markdown
            --pdf-engine=xelatex
            --number-sections
            --metadata=date=
            --resource-path=.:report
            --output=${{ env.REPORT_OUTPUT }}

      - name: Commit generated PDF
        if: github.event_name == 'push' && github.ref_name == env.REPORT_TARGET_BRANCH
        run: |
          cp "${REPORT_OUTPUT}" /tmp/MSc_group_p.pdf
          git fetch origin "${REPORT_TARGET_BRANCH}"
          git switch -C "${REPORT_TARGET_BRANCH}" "origin/${REPORT_TARGET_BRANCH}"
          mkdir -p "$(dirname "${REPORT_OUTPUT}")"
          cp /tmp/MSc_group_p.pdf "${REPORT_OUTPUT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${REPORT_OUTPUT}"
          if git diff --cached --quiet; then
            echo "No report PDF changes to commit."
          else
            git commit -m "Update generated report PDF [skip ci]"
            git push origin "HEAD:${REPORT_TARGET_BRANCH}"
          fi

      - name: Upload report PDF
        uses: actions/upload-artifact@v4
        with:
          name: MSc_group_p
          path: ${{ env.REPORT_OUTPUT }}
